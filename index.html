<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alfred — 3D FPS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="crosshair"></div>

  <div id="overlay">
    <h1>Alfred — 3D FPS</h1>
    <p>A flat world to run and jump around in.</p>
    <div class="cta">Click to play</div>
    <div class="keys">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move &nbsp;·&nbsp;
      <kbd>Space</kbd> jump &nbsp;·&nbsp; <kbd>Mouse</kbd> look &nbsp;·&nbsp; <kbd>Esc</kbd> release
    </div>
  </div>

  <div id="hint">Esc to release the mouse</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
