<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alfred — 3D FPS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* Click-to-play overlay */
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; color: #fff; cursor: pointer;
      background: rgba(10, 20, 30, 0.55); backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 { font-size: 34px; font-weight: 800; letter-spacing: 0.5px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    #overlay p { font-size: 15px; opacity: 0.9; }
    #overlay .keys { margin-top: 6px; font-size: 13px; opacity: 0.75; line-height: 1.7; }
    #overlay kbd {
      display: inline-block; padding: 1px 7px; border-radius: 5px;
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); font-family: inherit;
    }
    #overlay .cta {
      margin-top: 10px; padding: 10px 22px; border-radius: 999px;
      background: #fff; color: #123; font-weight: 700; font-size: 15px;
    }

    /* Crosshair */
    #crosshair {
      position: fixed; left: 50%; top: 50%; z-index: 5;
      width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none;
      opacity: 0; transition: opacity 0.2s ease;
    }
    #crosshair.visible { opacity: 0.8; }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,.6);
    }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after  { top: 8px; left: 0; height: 2px; width: 18px; }

    #hint {
      position: fixed; left: 12px; bottom: 10px; z-index: 5;
      color: rgba(255,255,255,.7); font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.5);
      pointer-events: none;
    }
  </style>

  <!-- Three.js as ES modules via CDN import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="crosshair"></div>

  <div id="overlay">
    <h1>Alfred — 3D FPS</h1>
    <p>A flat world to run and jump around in.</p>
    <div class="cta">Click to play</div>
    <div class="keys">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move &nbsp;·&nbsp;
      <kbd>Space</kbd> jump &nbsp;·&nbsp; <kbd>Mouse</kbd> look &nbsp;·&nbsp; <kbd>Esc</kbd> release
    </div>
  </div>

  <div id="hint">Esc to release the mouse</div>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // ---------- Renderer / scene / camera ----------
    const app = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 60, 200);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    // ---------- Lighting ----------
    const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x554433, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 150;
    sun.shadow.camera.left = -80;
    sun.shadow.camera.right = 80;
    sun.shadow.camera.top = 80;
    sun.shadow.camera.bottom = -80;
    scene.add(sun);

    // ---------- Ground ----------
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4f7a43, roughness: 1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(500, 250, 0x2f5030, 0x3d6640);
    grid.position.y = 0.01;
    scene.add(grid);

    // A few reference boxes so movement is legible
    const boxGeo = new THREE.BoxGeometry(2, 2, 2);
    const boxColors = [0xd9534f, 0xf0ad4e, 0x5bc0de, 0x9b59b6, 0xe0e0e0];
    for (let i = 0; i < 24; i++) {
      const c = boxColors[i % boxColors.length];
      const mat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
      const box = new THREE.Mesh(boxGeo, mat);
      // deterministic scatter so the world is stable across reloads
      const a = i * 2.3999632; // golden-angle spread
      const r = 8 + (i % 8) * 5;
      box.position.set(Math.cos(a) * r, 1, Math.sin(a) * r);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
    }

    // ---------- Controls (pointer lock) ----------
    const EYE = 1.7;
    const controls = new PointerLockControls(camera, renderer.domElement);
    controls.getObject().position.set(0, EYE, 8);
    scene.add(controls.getObject());

    const overlay = document.getElementById('overlay');
    const crosshair = document.getElementById('crosshair');

    document.body.addEventListener('click', () => {
      if (!controls.isLocked) controls.lock();
    });
    controls.addEventListener('lock', () => {
      overlay.classList.add('hidden');
      crosshair.classList.add('visible');
    });
    controls.addEventListener('unlock', () => {
      overlay.classList.remove('hidden');
      crosshair.classList.remove('visible');
    });

    // ---------- Movement state ----------
    const keys = { forward: false, back: false, left: false, right: false };
    let velocityY = 0;
    let canJump = true;

    const MOVE_SPEED = 8;      // units / second
    const GRAVITY = 26;        // units / second^2
    const JUMP_SPEED = 9;      // initial upward velocity

    addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    keys.forward = true; break;
        case 'KeyS': case 'ArrowDown':  keys.back = true; break;
        case 'KeyA': case 'ArrowLeft':  keys.left = true; break;
        case 'KeyD': case 'ArrowRight': keys.right = true; break;
        case 'Space':
          if (canJump) { velocityY = JUMP_SPEED; canJump = false; }
          break;
      }
    });
    addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    keys.forward = false; break;
        case 'KeyS': case 'ArrowDown':  keys.back = false; break;
        case 'KeyA': case 'ArrowLeft':  keys.left = false; break;
        case 'KeyD': case 'ArrowRight': keys.right = false; break;
      }
    });

    // ---------- Resize ----------
    addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Main loop ----------
    const clock = new THREE.Clock();
    const forwardDir = new THREE.Vector3();
    const rightDir = new THREE.Vector3();
    const move = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05); // clamp to avoid tunneling on lag spikes
      const obj = controls.getObject();

      if (controls.isLocked) {
        // Horizontal movement in camera-facing space (ignore pitch)
        camera.getWorldDirection(forwardDir);
        forwardDir.y = 0;
        forwardDir.normalize();
        rightDir.crossVectors(forwardDir, camera.up).normalize();

        move.set(0, 0, 0);
        if (keys.forward) move.add(forwardDir);
        if (keys.back)    move.sub(forwardDir);
        if (keys.right)   move.add(rightDir);
        if (keys.left)    move.sub(rightDir);
        if (move.lengthSq() > 0) move.normalize().multiplyScalar(MOVE_SPEED * dt);
        obj.position.x += move.x;
        obj.position.z += move.z;
      }

      // Gravity / jump (runs always so you land even after releasing the mouse)
      velocityY -= GRAVITY * dt;
      obj.position.y += velocityY * dt;
      if (obj.position.y <= EYE) {
        obj.position.y = EYE;
        velocityY = 0;
        canJump = true;
      }

      renderer.render(scene, camera);
    }
    animate();

    // ---------- Auto-reload on file change (dev convenience, like blobgame) ----------
    (function watchForChanges() {
      let last = null;
      setInterval(async () => {
        try {
          const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
          const mod = res.headers.get('Last-Modified');
          if (last && mod && mod !== last) location.reload();
          if (mod) last = mod;
        } catch (_) { /* server momentarily unavailable — ignore */ }
      }, 1000);
    })();
  </script>
</body>
</html>
