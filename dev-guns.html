<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muzzle flash placement harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #14161a; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .tile {
      position: absolute;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #eef4fa;
      text-shadow: 0 1px 2px #000, 0 0 6px #000;
      padding: 4px 6px;
    }
    .tile b { font-size: 13px; color: #ffe9a8; }
    .tile .dim { color: #a8e0ff; }
    #bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      font: 12px/1.6 ui-monospace, monospace; color: #cfe3f2;
      background: rgba(0,0,0,.6); padding: 4px 8px; white-space: pre;
    }
    .cellborder { position: absolute; border: 1px solid rgba(255,255,255,.09); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="bar"></div>
  <script type="module" src="/src/dev-guns.js"></script>
</body>
</html>
