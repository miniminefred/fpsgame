<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level dev harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #111; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #info {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      font: 12px/1.5 ui-monospace, monospace; color: #cfe3f2;
      background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 4px;
      white-space: pre; pointer-events: none;
    }
    #hint {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
      font: 16px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.6);
      cursor: pointer;
    }
    #hint.hidden { display: none; }
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 4px; height: 4px;
      margin: -2px 0 0 -2px; background: #fff; border-radius: 50%; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="info"></div>
  <div id="hint">Click to play — WASD, Shift sprint, Space jump, N new floor, Esc release</div>
  <script type="module" src="/src/dev-level.js"></script>
</body>
</html>
